http {
    upstream risk_engine {
        server risk-engine:8001;
    }

    upstream clip_service {
        server clip-service:8002;
    }

    upstream web_ui {
        server risk-web-ui:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        # Web UI
        location / {
            proxy_pass http://web_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Risk Engine API
        location /api/ {
            proxy_pass http://risk_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Clip Service API
        location /clips/ {
            proxy_pass http://clip_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Large timeouts for video streaming
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}

events {
    worker_connections 1024;
}
