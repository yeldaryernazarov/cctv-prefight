# Конфигурация камер для тестирования
# Скопируйте этот файл в cameras.yaml и настройте под ваши камеры

# ===============================================
# ТЕСТИРОВАНИЕ С КАМЕРОЙ ТЕЛЕФОНА
# ===============================================
# 
# Чтобы использовать камеру телефона для тестирования:
# 
# 1. Установите приложение на телефон (одно из):
#    - IP Webcam (Android): https://play.google.com/store/apps/details?id=com.pas.webcam
#    - EpocCam (iOS/Android): https://www.kinoni.com/
#    - DroidCam (Android/iOS): https://www.dev47apps.com/
# 
# 2. Подключите телефон к той же WiFi сети, что и компьютер
# 
# 3. Запустите приложение и найдите RTSP URL (обычно показан в приложении)
#    Пример для IP Webcam: rtsp://192.168.1.150:8080/h264_ulaw.sdp
# 
# 4. Замените rtsp_url ниже на URL из приложения
# 
# 5. Сохраните этот файл как cameras.yaml
# 
# ===============================================

cameras:
  # Тестовая камера - замените URL на ваш RTSP URL из приложения телефона
  - id: "camera-test-phone"
    name: "Test Phone Camera"
    # ЗАМЕНИТЕ ЭТОТ URL НА URL ИЗ ВАШЕГО ПРИЛОЖЕНИЯ!
    # Примеры:
    # IP Webcam: rtsp://192.168.1.150:8080/h264_ulaw.sdp
    # DroidCam: rtsp://192.168.1.150:4747/video
    rtsp_url: "rtsp://192.168.1.168:8080/h264_ulaw.sdp"
    rtsp_substream_url: null  # Можно оставить пустым для тестирования
    location: "Test Location"
    fps: 15
    zones:
      - id: "zone-test-1"
        name: "Test Zone"
        # Зона покрывает весь кадр (обычно 640x480 или 1280x720)
        polygon:
          - {x: 50, y: 50}
          - {x: 590, y: 50}
          - {x: 590, y: 430}
          - {x: 50, y: 430}
        zone_type: "corridor"
        schedule_profile: "default"

  # Пример: реальная IP камера (если есть)
  # - id: "camera-entrance-1"
  #   name: "Main Entrance"
  #   rtsp_url: "rtsp://admin:password@192.168.1.100:554/stream1"
  #   rtsp_substream_url: "rtsp://admin:password@192.168.1.100:554/stream2"
  #   location: "Main Entrance"
  #   fps: 15
  #   zones:
  #     - id: "zone-entrance-1"
  #       name: "Entrance Hallway"
  #       polygon:
  #         - {x: 100, y: 100}
  #         - {x: 600, y: 100}
  #         - {x: 600, y: 500}
  #         - {x: 100, y: 500}
  #       zone_type: "entrance"
  #       schedule_profile: "default"

# Настройки риск-событий
risk_event_config:
  PROXIMITY_RISK:
    distance_threshold: 1.5  # Нормализованное расстояние
    duration_min_sec: 2.0
    rapid_approach_percent: 50
  
  CROWD_RISK:
    min_count: 5
    density_threshold: 0.3
    area_threshold: 100
  
  KINETIC_RISK:
    acceleration_threshold: 5.0
    duration_min_sec: 1.5

# Профили расписания
schedule_profiles:
  default:
    # Стандартный мониторинг
    weight_multiplier: 1.0
  
  quiet:
    # Во время уроков - повышенная чувствительность
    weight_multiplier: 1.5
  
  break:
    # Во время перемен - пониженная чувствительность
    weight_multiplier: 0.7

# ----------------------------
# Модели (опционально)
# ----------------------------
# Система умеет автоматически включать детекцию:
# - violence: если в deepstream-analytics/models/ лежит `pose_model_torchscript.pt` (и есть pose YOLO)
# - profanity: если в deepstream-analytics/models/ лежит `profanity_keywords_ru.txt` (нужен easyocr)
#
# Можно также явно указать пути:
models:
  # Person YOLO (детекция людей)
  person_yolo_path: null

  # Pose YOLO (YOLO pose для извлечения keypoints под violence model)
  pose_yolo_path: yolov8m-pose.pt

  # TorchScript модели из ноутбука (PoseViolenceDetector)
  violence_torchscript_path: fight_detector.pt

  # Файл из ноутбука `pose_config.json` (опционально, для чтения SEQUENCE_LENGTH/MAX_PERSONS/NUM_KEYPOINTS)
  pose_config_path: null

person_detection:
  class_ids: [0]     # COCO: person
  conf: 0.3

violence_detection:
  enabled: true      
  violence_threshold: 0.7
  # Алерт в risk-engine отправляем только при вероятности >= 0.85
  video_alert_threshold: 0.85
  inference_every_sec: 1.0
  event_cooldown_sec: 10.0
  pose_confidence_threshold: 0.3

# 1-й этап: аудио из RTSP (как скользящее окно в a.py).
# 2-й этап: видео-классификатор включается только если audio score >= pretrigger_threshold.
audio_gate:
  sample_rate: 16000
  window_seconds: 5
  overlap_seconds: 2
  pretrigger_threshold: 0.50
  # Как часто писать в логи текущий audio score и состояние gate
  debug_log_every_sec: 5.0
  # Как часто публиковать audio debug в stream-server (/debug/audio/{camera_id})
  debug_publish_every_sec: 1.0

profanity_detection:
  enabled: false
  # keywords_file: null  # если null, ищется deepstream-analytics/models/profanity_keywords_ru.txt
  ocr_every_n_frames: 15
  event_cooldown_sec: 30.0
  easyocr_languages: ["ru", "en"]
  min_keywords_found: 1

# Публикация обработанных кадров (с AI-оверлеями) в stream-server для Web UI.
stream_output:
  enabled: true
  # Локально на Windows обычно http://localhost:8003
  server_url: "http://localhost:8003"
  every_n_frames: 2
  jpeg_quality: 80
